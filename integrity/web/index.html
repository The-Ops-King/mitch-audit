<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dating Offer Audit</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--base:#c3c2b7;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s1soft:#cde2fb;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--goodtext:#006300;
  --chip:#f0efec;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--base:#383835;--ring:rgba(255,255,255,.10);
    --s1:#3987e5;--s2:#d95926;--s1soft:#184f95;--goodtext:#0ca30c;--chip:#2c2c2a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--base:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s1soft:#184f95;--goodtext:#0ca30c;--chip:#2c2c2a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--s1)}
header{padding:20px 16px 0;max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px;font-weight:650}
.sub{color:var(--ink2);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;border-radius:8px 8px 0 0;color:var(--ink2);white-space:nowrap;font-weight:550}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--s1)}
.tabs button .soon{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
nav.sec{position:sticky;top:0;z-index:5;background:var(--page);border-bottom:1px solid var(--grid)}
nav.sec .in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.sec button{all:unset;cursor:pointer;padding:10px 10px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
nav.sec button[aria-current="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:18px;margin:28px 0 4px;font-weight:650}
h2:first-child{margin-top:4px}
h3{font-size:15px;margin:0 0 8px;font-weight:620}
p.lead{color:var(--ink2);margin:0 0 14px;max-width:780px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
.tile .v{font-size:30px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--ink2);font-size:13px;margin-top:4px}
.tile .x{color:var(--muted);font-size:12px;margin-top:2px}
.note{font-size:13px;color:var(--ink2)}
.muted{color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.strip span{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.strip span b{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--base);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--grid);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.drill{all:unset;cursor:pointer;color:var(--s1);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--s1) 35%,transparent);text-underline-offset:2px}
.drill:hover{text-decoration-color:var(--s1)}
/* bars */
.bars{display:grid;grid-template-columns:minmax(110px,max-content) 1fr max-content;gap:6px 10px;align-items:center;font-size:13.5px}
.bars .lbl{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.bars .track{position:relative;height:14px}
.bars .fill{position:absolute;left:0;top:1px;height:12px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bars .fill.b{background:var(--s2);top:8px;height:6px}
.bars .fill.a{top:0;height:6px}
.bars .val{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bars .row{display:contents}
.bars .row:hover .lbl{color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:0 0 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* funnel */
.funnel{display:grid;gap:6px}
.funnel .st{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;gap:10px;font-size:14px}
.funnel .bar{height:26px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.funnel .st:nth-child(n+2) .bar{opacity:.85}
.funnel .num{font-variant-numeric:tabular-nums}
.funnel .num small{color:var(--muted)}
/* severity */
.sev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.sev i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sev.critical i{background:var(--crit)}.sev.high i{background:var(--serious)}.sev.medium i{background:var(--warn)}.sev.low i{background:var(--base)}
/* findings */
.find{display:grid;grid-template-columns:28px 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--grid)}
.find:first-of-type{border-top:0}
.find .k{font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.find h3{margin:0 0 4px}
.find .p{margin:0 0 6px}
.find .f{margin:0;color:var(--ink2);font-size:14px}
.owner{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;margin-right:6px;background:var(--chip);color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
select,input[type=search]{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--base);background:var(--surface);color:var(--ink)}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--s1soft);color:var(--ink);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.pill button{all:unset;cursor:pointer;padding:0 6px;font-weight:700}
.won{color:var(--goodtext);font-weight:600}
.pending{padding:40px 16px;text-align:center;color:var(--ink2)}
#tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:6px;max-width:280px;opacity:0;transition:opacity .08s}
.score{font-variant-numeric:tabular-nums;font-weight:600}
details summary{cursor:pointer;color:var(--ink2);font-size:13.5px}
.theme{position:absolute;top:18px;right:16px}
header{position:relative}
.theme button{all:unset;cursor:pointer;font-size:12.5px;color:var(--ink2);border:1px solid var(--base);border-radius:999px;padding:3px 10px}
@media (max-width:600px){
  .funnel .st{grid-template-columns:84px 1fr 96px;font-size:13px}
  .bars{grid-template-columns:minmax(90px,40%) 1fr max-content}
  .tile .v{font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="theme"><button id="themeBtn" type="button">Theme</button></div>
  <h1>Dating offer audit</h1>
  <p class="sub">End to end: lead, text, setter call, closer call. Built from CRM records, call recordings and text threads.</p>
  <div class="tabs" role="tablist" id="offerTabs"></div>
</header>
<nav class="sec" aria-label="Sections"><div class="in" id="secNav"></div></nav>
<main id="main"></main>
<div id="tip" role="tooltip"></div>

<script>
const OFFERS = [
  { id: "krc", name: "Kimberly Rae", data: "data/krc.json" },
  { id: "bvw", name: "Barak Van Wyk", data: null },
  { id: "offer3", name: "Offer 3", data: null },
];
const SECTIONS = [
  ["overview", "Overview"], ["funnel", "Funnel"], ["texting", "Texting"], ["setter", "Setter calls"],
  ["closer", "Closer calls"], ["patterns", "Patterns"], ["offer", "Objections & pricing"],
  ["buyers", "Buyers"], ["flags", "Integrity flags"], ["reps", "Reps"], ["calls", "Calls"],
];
const cache = {};
let state = { offer: "krc", sec: "overview", drill: null };

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "n/a" : Number(n).toLocaleString("en-US");
const money = n => "$" + fmt(Math.round(n));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const human = k => String(k ?? "").replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const sevBadge = s => `<span class="sev ${esc(s)}"><i aria-hidden="true"></i>${esc(human(s))}</span>`;
let drillReg = [];
function drillLink(text, ids, label) {
  if (!ids || !ids.length) return esc(text);
  drillReg.push({ ids, label });
  return `<button class="drill" data-drill="${drillReg.length - 1}" title="Show these calls">${esc(text)}</button>`;
}
function bars(rows, opts = {}) {
  // rows: {label, value, max?, text?, tip?, b?, btext?}
  const max = opts.max ?? Math.max(1, ...rows.map(r => Math.max(r.value, r.b ?? 0)));
  return `<div class="bars">${rows.map(r => {
    const w = 100 * r.value / max, wb = r.b != null ? 100 * r.b / max : null;
    return `<div class="row" data-tip="${esc(r.tip ?? "")}"><div class="lbl" title="${esc(r.label)}">${esc(r.label)}</div>
      <div class="track">${wb != null ? `<div class="fill a" style="width:${w}%"></div><div class="fill b" style="width:${wb}%"></div>` : `<div class="fill" style="width:${w}%"></div>`}</div>
      <div class="val">${r.html ?? esc(r.text ?? fmt(r.value))}</div></div>`;
  }).join("")}</div>`;
}
const niceDate = s => new Date(s + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const tile = (v, l, x = "") => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div>${x ? `<div class="x">${x}</div>` : ""}</div>`;

/* ---------- copy: findings per offer (problem / fix / owner) ---------- */
function findingsKRC(d) {
  const f = d.funnel.overall, c = d.closer, t = d.texting, cal = d.funnel.calendly;
  const dcb = cal["Direct booking (DCB)"] || {};
  const price = c.objections.find(o => o.type === "price_budget") || {};
  const fin = c.question_lift.find(q => q.key === "financial_capacity") || {};
  const c11 = c.phases.find(p => p.id === "C11") || {};
  const cat = k => (c.flag_categories.find(x => x.category === k) || {});
  const tcat = k => ((t.flag_categories.find(x => x[0] === k) || [])[1] || 0);
  const well = cat("wellbeing_risk"), comp = cat("compliance");
  const top = (a, n) => a.slice().sort((x, y) => y.calls - x.calls).slice(0, n);
  const offSheet = top(c.offer.prices_quoted.filter(p => !p.sanctioned), 2);
  return [
    { h: "Speed to lead is slow and leaky",
      p: `Since ${niceDate(d.funnel.since)}, ${fmt(f.leads)} new leads came in. ${fmt(f.leads - f.contacted)} (${pct(f.leads - f.contacted, f.leads)}%) never got a call or text. Median time to first touch was ${fmt(f.median_minutes)} minutes, and ${fmt(f.contacted_5min)} leads were reached inside 5 minutes.`,
      fix: "Instant Slack alert and a Close task on every new lead, plus a smart view of untouched leads older than 15 minutes. These are in the automation plan.", own: ["Leah"] },
    { h: "Most direct bookings get cancelled by the team, with no reason recorded",
      p: `${fmt(dcb.canceled_by_host)} of ${fmt(dcb.bookings)} direct Calendly bookings were cancelled by the host side. The lead cancelled ${fmt(dcb.canceled_by_lead)}. Some of these are probably triage disqualifications, but nothing records why, so nobody can tell a bad lead from a scheduling problem.`,
      fix: "Make a cancel reason required and write it to the lead in Close. Mitch decides whether host-side triage cancels are the intended process.", own: ["Leah", "Mitch"] },
    { h: "Closers make up prices",
      p: `The offer has 3 prices. Across ${fmt(c.offer.calls_pitched)} pitched calls, reps quoted ${fmt(c.offer.distinct_prices)} different prices, and ${fmt(c.offer.calls_with_off_sheet_price)} calls had at least one price that isn't on the sheet. The most common were ${offSheet.map(p => drillLink(money(p.price_usd) + " on " + p.calls + " calls", p.call_ids, "Calls quoting " + money(p.price_usd))).join(" and ")}.`,
      fix: "One price sheet. Any other price needs Mitch's sign-off before it's said on a call. The AI call review flags off-sheet prices automatically.", own: ["Mitch", "Sid", "Leah"] },
    { h: "Reps promise relationship outcomes",
      p: `${fmt(c.offer.outcome_promises)} of ${fmt(c.offer.calls_pitched)} pitched calls included a promise or strong implication that the prospect will find a partner. Example: "${esc((c.offer.outcome_promise_examples[0] || "").replace(/[\s,.;:]+$/, ""))}." The closing script forbids this, and it creates refund and chargeback risk.`,
      fix: "Ban success-rate claims that can't be backed up. Give reps one approved proof line. The AI call review flags any promise.", own: ["Mitch", "Sid", "Leah"] },
    { h: "Money comes up too late",
      p: `The step that sets up the investment before the price (C11) was run on ${fmt(c11.adherence_pct)}% of calls. Price objections showed up ${fmt(price.n)} times, ${fmt(price.when?.after_price)} of them after the price was said, and ${fmt(price.resolved_pct)}% were resolved. A question about what the prospect can invest appeared in ${fmt(fin.won_pct)}% of won calls and ${fmt(fin.not_won_pct)}% of the rest. That's 6 won calls, so treat it as a strong hint, not proof.`,
      fix: "Train the money question and the next-steps frame before the pitch. Score both in the AI call review.", own: ["Sid"] },
    { h: "Texts go unanswered and some setters push past a no",
      p: `${fmt(t.summary.threads - t.summary.lead_replied)} of ${fmt(t.summary.threads)} text threads never got a reply from the lead. Where leads did reply, the business was the one that went quiet on ${fmt(t.summary.business_went_silent)} threads. There are ${fmt(tcat("missed_lead"))} missed-lead flags (a lead asked something and nobody answered) and ${fmt(tcat("conduct"))} conduct flags, mostly setters pushing after the lead said no. Setters also broke the price rule by text ${fmt(tcat("pricing_deviation"))} times, quoting exact prices or ranges above the approved anchor.`,
      fix: "Close smart view: lead replied, no answer after 2 hours. Opt-out and stop-after-no rules for setters. Price stays a range by text.", own: ["Leah", "Sid"] },
    { h: "No protocol when a prospect discloses a crisis",
      p: `${fmt(well.calls)} closer calls and ${fmt(tcat("wellbeing_risk"))} text threads have a prospect disclosing self-harm, abuse or severe distress while the rep kept selling or nobody followed up. One thread has a disclosed overdose that got a one-line reply, and the lead's next message is still unanswered.`,
      fix: "Written crisis protocol: stop selling, give a crisis line, tell a manager the same day. Keyword alert on inbound texts.", own: ["Mitch", "Leah"] },
    { h: "Compliance gaps on recorded calls",
      p: `${fmt(comp.calls)} of ${fmt(c.summary.calls)} calls have a compliance flag, mostly no recording disclosure. On one call a rep had the prospect read his Social Security number aloud while recording.`,
      fix: "Disclosure line at the start of every call. Never collect ID numbers on a call; financing applications go through the lender's own link.", own: ["Sid", "Mitch"] },
    { h: "The CRM can't be fully trusted yet",
      p: `${fmt(d.funnel.recording_coverage_all_eocs.none)} of ${fmt(d.funnel.eoc_total)} End-of-Call reports have no recording link. On ${fmt(c.data_mismatches)} calls the outcome the rep logged doesn't match what happened on the recording.`,
      fix: "Recording link required on the EOC form. The AI call review compares the logged outcome with the transcript and flags mismatches.", own: ["Leah"] },
  ];
}

/* ---------- sections ---------- */
const R = {};
R.overview = d => {
  const f = d.funnel.overall, c = d.closer, t = d.texting, cov = d.funnel.recording_coverage_all_eocs;
  const items = findingsKRC(d);
  return `
  <div class="strip">
    <span><b>${fmt(f.leads)}</b> leads since ${esc(d.funnel.since)}</span>
    <span><b>${fmt(t.summary.threads)}</b> text threads</span>
    <span><b>${fmt(c.summary.calls)}</b> closer recordings analysed of ${fmt(d.funnel.eoc_total)} EOCs</span>
    <span>Setter calls: <b>transcribing</b></span>
    <span>ManyChat DMs: <b>waiting on access</b></span>
  </div>
  <div class="grid g4">
    ${tile(fmt(f.leads), "New leads since " + esc(d.funnel.since))}
    ${tile(pct(f.contacted_5min, f.leads) + "%", "Reached inside 5 minutes", fmt(f.contacted_5min) + " leads")}
    ${tile(fmt(f.booked) + " → " + fmt(f.showed), "Booked → showed", pct(f.showed, f.booked) + "% show rate")}
    ${tile(fmt(f.closed), "Closed deals", money(f.cash) + " cash collected")}
  </div>
  <h2>What we found and what to do</h2>
  <p class="lead">Each item lists the problem, the fix and who owns it. Leah builds the automated fixes. Mitch and Sid handle training and decisions. Underlined numbers open the calls behind them.</p>
  <div class="card">${items.map((x, i) => `<div class="find"><div class="k">${i + 1}</div><div>
    <h3>${esc(x.h)}</h3><p class="p">${x.p}</p>
    <p class="f">${x.own.map(o => `<span class="owner">${esc(o)}</span>`).join("")}${esc(x.fix)}</p></div></div>`).join("")}</div>
  <h2>How to read this</h2>
  <div class="card note">
    <p style="margin-top:0">Outcomes come from the CRM (Close, Calendly and the closers' End-of-Call reports), not from guessing what happened on a call. A deposit is not counted as a closed deal.</p>
    <p>Patterns say a thing <em>appeared in</em> won or lost calls. They don't prove it caused the result. Anything based on fewer than ${d.meta.min_n} calls is hidden or marked.</p>
    <p>The ${fmt(c.summary.calls)} closer recordings are the ones we could open: ${fmt(cov.fathom)} on Fathom (June to August, reps who have since left) and ${fmt(cov.zoom)} on Zoom (September to November). ${fmt(cov.calendly)} Calendly-hosted recordings need a logged-in export. ${fmt(cov.drive)} Google Drive files are being transcribed.</p>
    <p style="margin-bottom:0">Prospects are shown as initials. Emails, phone numbers and ID numbers are removed. No transcripts are published.</p>
  </div>`;
};

R.funnel = d => {
  const F = d.funnel, f = F.overall;
  const stages = [["Leads", f.leads], ["Contacted", f.contacted], ["Booked", f.booked], ["Showed", f.showed], ["Closed", f.closed]];
  const src = Object.entries(F.by_source).sort((a, b) => b[1].leads - a[1].leads);
  const mon = Object.entries(F.by_month);
  const cal = Object.entries(F.calendly);
  const eoc = Object.entries(F.eoc_outcomes_since).sort((a, b) => b[1] - a[1]);
  const row = (k, v) => `<tr><td>${esc(k)}</td><td class="n">${fmt(v.leads)}</td><td class="n">${pct(v.contacted, v.leads)}%</td><td class="n">${pct(v.contacted_5min, v.leads)}%</td><td class="n">${v.median_minutes == null ? "n/a" : fmt(v.median_minutes) + " min"}</td><td class="n">${fmt(v.booked)}</td><td class="n">${fmt(v.showed)}</td><td class="n">${fmt(v.closed)}</td><td class="n">${money(v.cash)}</td></tr>`;
  const head = first => `<thead><tr><th>${first}</th><th class="n">Leads</th><th class="n">Contacted</th><th class="n">In 5 min</th><th class="n">Median first touch</th><th class="n">Booked</th><th class="n">Showed</th><th class="n">Closed</th><th class="n">Cash</th></tr></thead>`;
  return `
  <h2>Lead to cash since ${esc(F.since)}</h2>
  <p class="lead">Every lead created in Close since ${esc(F.since)}, matched by email to Calendly bookings, End-of-Call reports and payments.</p>
  <div class="card"><div class="funnel">${stages.map(([k, v], i) => `<div class="st" data-tip="${esc(k)}: ${fmt(v)} (${pct(v, f.leads)}% of leads${i ? ", " + pct(v, stages[i - 1][1]) + "% of previous step" : ""})"><div>${k}</div><div><div class="bar" style="width:${Math.max(.4, 100 * v / f.leads)}%"></div></div><div class="num">${fmt(v)} <small>${i ? pct(v, stages[i - 1][1]) + "% of prev" : ""}</small></div></div>`).join("")}</div></div>
  <div class="grid g4">
    ${tile(fmt(f.median_minutes) + " min", "Median time to first call or text")}
    ${tile(pct(f.contacted_5min, f.leads) + "%", "Reached inside 5 minutes")}
    ${tile(pct(f.contacted_60min, f.leads) + "%", "Reached inside 1 hour")}
    ${tile(fmt(f.leads - f.contacted), "Leads never contacted", pct(f.leads - f.contacted, f.leads) + "% of all leads")}
  </div>
  <h2>By lead source</h2>
  <div class="card tw"><table>${head("Source")}<tbody>${src.map(([k, v]) => row(k, v)).join("")}</tbody></table>
  <p class="note" style="margin-bottom:0">Source is the Close "Opt Source" field. Kajabi freebie opt-ins are grouped.</p></div>
  <h2>By month</h2>
  <div class="card tw"><table>${head("Month")}<tbody>${mon.map(([k, v]) => row(k, v)).join("")}</tbody></table>

R.texting = d => {

  return `

function flagTable(rows, key) {
  const cats = [...new Set(rows.map(r => r.category))].sort();
  const id = "ft_" + key;
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const run = () => {
      const cat = el.querySelector(".fc").value, sev = el.querySelector(".fs").value, q = el.querySelector(".fq").value.toLowerCase();
      el.querySelectorAll("tbody tr").forEach(tr => {
        const ok = (!cat || tr.dataset.c === cat) && (!sev || tr.dataset.s === sev) && (!q || tr.textContent.toLowerCase().includes(q));
        tr.hidden = !ok;
      });
    };
    el.querySelectorAll("select,input").forEach(i => i.addEventListener("input", run));
  });
  const order = { critical: 0, high: 1, medium: 2, low: 3 };
  const sorted = rows.slice().sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));
  return `<div class="card" id="${id}"><div class="filters">
    <select class="fc" aria-label="Category"><option value="">All categories</option>${cats.map(c => `<option value="${esc(c)}">${esc(human(c))}</option>`).join("")}</select>
    <select class="fs" aria-label="Severity"><option value="">All severities</option>${["critical", "high", "medium", "low"].map(s => `<option value="${s}">${human(s)}</option>`).join("")}</select>
    <input class="fq" type="search" placeholder="Search" aria-label="Search flags"><span class="note">${fmt(rows.length)} flags</span></div>
    <div class="tw" style="max-height:560px;overflow-y:auto"><table><thead><tr><th>Severity</th><th>Category</th>${rows[0]?.rep !== undefined ? "<th>Rep</th>" : ""}<th>What happened</th></tr></thead><tbody>
    ${sorted.map(r => `<tr data-c="${esc(r.category)}" data-s="${esc(r.severity)}"><td>${sevBadge(r.severity)}</td><td>${esc(human(r.category))}</td>${r.rep !== undefined ? `<td>${esc(r.rep)}</td>` : ""}<td>${esc(r.summary)}${r.call_id ? ` <button class="drill" data-call="${esc(r.call_id)}">call</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

/* ---------- shell ---------- */
async function load(o) {
  if (!o.data) return null;
  if (!cache[o.id]) cache[o.id] = fetch(o.data, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return cache[o.id];
}
function renderTabs() {
  $("#offerTabs").innerHTML = OFFERS.map(o => `<button role="tab" aria-selected="${o.id === state.offer}" data-o="${o.id}">${esc(o.name)}${o.data ? "" : '<span class="soon">next</span>'}</button>`).join("");
  $("#secNav").innerHTML = SECTIONS.map(([k, v]) => `<button data-s="${k}" aria-current="${k === state.sec}">${v}</button>`).join("");
}
async function render() {
  renderTabs();
  const o = OFFERS.find(x => x.id === state.offer) || OFFERS[0];
  const main = $("#main");
  if (!o.data) { main.innerHTML = `<div class="card pending"><h2 style="margin-top:0">${esc(o.name)}</h2>This offer's audit is next. Same sections, same method.</div>`; return; }
  let d;
  try { d = await load(o); } catch (e) { main.innerHTML = `<div class="card pending">Couldn't load the data (${esc(e.message)}).</div>`; return; }
  drillReg = [];
  main.innerHTML = (R[state.sec] || R.overview)(d) + `<p class="note muted" style="margin-top:30px">Data pulled ${esc(d.meta.generated_at.slice(0, 10))}.</p>`;
}
function go(patch, push = true) {
  state = { ...state, ...patch };
  const h = `#${state.offer}/${state.sec}`;
  if (push && location.hash !== h) history.pushState(null, "", h);
  render(); window.scrollTo({ top: 0 });
}
function fromHash() {
  const [o, s] = location.hash.slice(1).split("/");
  state.offer = OFFERS.some(x => x.id === o) ? o : "krc";
  state.sec = SECTIONS.some(x => x[0] === s) ? s : "overview";
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.o) go({ offer: t.dataset.o, sec: "overview", drill: null });
  else if (t.dataset.s) go({ sec: t.dataset.s, drill: t.dataset.s === "calls" ? state.drill : null });
  else if (t.dataset.drill != null) { const r = drillReg[+t.dataset.drill]; go({ sec: "calls", drill: r }); }
  else if (t.dataset.call) { state.focus = t.dataset.call; go({ sec: "calls", drill: null }); }
});
window.addEventListener("popstate", () => { fromHash(); render(); });
/* tooltip */
const tip = $("#tip");
document.addEventListener("pointermove", e => {
  const r = e.target.closest("[data-tip]");
  if (!r || !r.dataset.tip) { tip.style.opacity = 0; return; }
  tip.textContent = r.dataset.tip; tip.style.opacity = 1;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = (y + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + "px";
});
/* theme */
try { const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx;
  try { localStorage.setItem("theme", nx); } catch (_) {}
};
fromHash(); render();
</script>
</body>
</html>
